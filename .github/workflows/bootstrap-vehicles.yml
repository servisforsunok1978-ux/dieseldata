name: bootstrap-vehicles

# Одноразовий запуск: створює НОВУ Google-таблицю сервісним акаунтом, вигружає в
# неї поточні vehicles із Supabase і ділиться нею з OWNER_EMAIL на Редагування.
# Лише ручний запуск. Після успіху — покласти надрукований SPREADSHEET_ID у
# GitHub variable SHEET_ID_VEHICLES (робиться поза цим workflow).

on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: 'Пошта, якій дати доступ Редагування'
        required: true
        default: servisforsunok1978@gmail.com
      title:
        description: 'Назва Google-таблиці'
        required: false
        default: 'dieseldata · vehicles (source of truth)'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/bootstrap_vehicles.py --create --title "${{ inputs.title }}"
        env:
          OWNER_EMAIL: ${{ inputs.owner_email }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_DB_HOST: aws-0-eu-west-3.pooler.supabase.com
          SUPABASE_DB_PORT: '6543'
          SUPABASE_DB_USER: postgres.fxqboawaiwgltvxxykan
          SUPABASE_DB_NAME: postgres
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
