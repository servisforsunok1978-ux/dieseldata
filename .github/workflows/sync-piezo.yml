name: sync-piezo

on:
  schedule:
    - cron: '0 6 * * *'   # щодня 06:00 UTC; GitHub може затримувати запуски
  workflow_dispatch: {}    # ручний запуск із вкладки Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/sync_piezo.py
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Компоненти підключення до Postgres. Секрет — лише пароль (сирий,
          # без URL-екранування). Хост/користувач/порт/БД не є секретами.
          SUPABASE_DB_HOST: aws-0-eu-west-3.pooler.supabase.com
          SUPABASE_DB_PORT: '6543'
          SUPABASE_DB_USER: postgres.fxqboawaiwgltvxxykan
          SUPABASE_DB_NAME: postgres
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
